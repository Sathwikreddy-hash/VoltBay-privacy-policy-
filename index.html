<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Privacy Policy — VoltBay</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #080d12;
      --surface: #0e1620;
      --border: #1a2a3a;
      --accent: #00f5a0;
      --accent2: #00c6ff;
      --text: #e8f0f7;
      --muted: #7a9ab0;
      --glow: 0 0 40px rgba(0,245,160,0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      line-height: 1.8;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,245,160,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,160,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glow orbs */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      right: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0,198,255,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .orb2 {
      position: fixed;
      bottom: -200px;
      left: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0,245,160,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 10;
      padding: 40px 0 0;
      text-align: center;
    }

    .logo-wrap {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 48px;
    }

    .logo-img {
      height: 80px;
      width: auto;
      filter: drop-shadow(0 0 16px rgba(0,245,160,0.3));
    }

    .hero {
      position: relative;
      z-index: 10;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px 60px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: rgba(0,245,160,0.08);
      border: 1px solid rgba(0,245,160,0.2);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 100px;
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 16px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 400;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      margin: 32px auto;
      border-radius: 2px;
    }

    main {
      position: relative;
      z-index: 10;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 20px;
      transition: border-color 0.3s;
      animation: fadeUp 0.6s ease both;
    }

    .section:hover {
      border-color: rgba(0,245,160,0.2);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section:nth-child(1) { animation-delay: 0.05s; }
    .section:nth-child(2) { animation-delay: 0.1s; }
    .section:nth-child(3) { animation-delay: 0.15s; }
    .section:nth-child(4) { animation-delay: 0.2s; }
    .section:nth-child(5) { animation-delay: 0.25s; }
    .section:nth-child(6) { animation-delay: 0.3s; }
    .section:nth-child(7) { animation-delay: 0.35s; }
    .section:nth-child(8) { animation-delay: 0.4s; }

    .section-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .section-num {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(0,245,160,0.15), rgba(0,198,255,0.1));
      border: 1px solid rgba(0,245,160,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--accent);
      flex-shrink: 0;
    }

    h2 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.01em;
    }

    p {
      color: #b0c4d4;
      font-size: 0.93rem;
      line-height: 1.85;
      margin-bottom: 12px;
    }

    p:last-child { margin-bottom: 0; }

    ul {
      list-style: none;
      padding: 0;
    }

    ul li {
      color: #b0c4d4;
      font-size: 0.93rem;
      padding: 6px 0 6px 20px;
      position: relative;
    }

    ul li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.6;
    }

    .highlight-box {
      background: rgba(0,245,160,0.05);
      border: 1px solid rgba(0,245,160,0.15);
      border-radius: 10px;
      padding: 16px 20px;
      margin-top: 12px;
    }

    .highlight-box p {
      color: rgba(0,245,160,0.85);
      font-size: 0.88rem;
      margin: 0;
    }

    .contact-card {
      background: linear-gradient(135deg, rgba(0,245,160,0.06), rgba(0,198,255,0.04));
      border: 1px solid rgba(0,245,160,0.2);
      border-radius: 12px;
      padding: 20px 24px;
      margin-top: 12px;
    }

    .contact-card a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .contact-card a:hover { text-decoration: underline; }

    footer {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 32px 24px 48px;
      color: var(--muted);
      font-size: 0.82rem;
      border-top: 1px solid var(--border);
    }

    footer span {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 600;
    }
  </style>
</head>
